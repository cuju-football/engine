name: release

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            publish:
                description: Publish the sdist and the wheels to PyPI
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    sdist:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
            - name: Date every file of the build by the commit
              run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
            - name: Build the sdist twice and compare the bytes
              run: |
                  pip install build
                  python -m build --sdist --outdir dist
                  python -m build --sdist --outdir "$RUNNER_TEMP/sdist-again"
                  python ci/checks/compare_builds.py dist "$RUNNER_TEMP/sdist-again"
            - uses: actions/upload-artifact@v7
              with:
                  name: sdist
                  path: dist/*.tar.gz

    gfootball:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
            - name: Date every file of the build by the commit
              run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
            - name: Build the sdist and the wheel of cuju-gfootball twice and compare the bytes
              run: |
                  pip install build
                  python -m build packages/cuju-gfootball --outdir dist
                  python -m build packages/cuju-gfootball --outdir "$RUNNER_TEMP/gfootball-again"
                  python ci/checks/compare_builds.py dist "$RUNNER_TEMP/gfootball-again"
            - name: Check the contents of the wheel
              run: |
                  python ci/checks/check_wheel.py --alias dist/*.whl
                  python -c "import sys, zipfile; [print(n) for n in zipfile.ZipFile(sys.argv[1]).namelist()]" dist/*.whl
            - uses: actions/upload-artifact@v7
              with:
                  name: cuju-gfootball
                  path: dist/*

    wheel:
        name: wheel ${{ matrix.name }}
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # `-real` keeps PTX out, so no driver compiles it for a GPU no check covered.
                    - name: linux-x86-64
                      runner: ubuntu-24.04
                      cibuildwheel: cp312-manylinux_x86_64
                      before_all: bash ci/install_cuda.sh
                      environment: >-
                          PATH=/usr/local/cuda/bin:$PATH
                          CXX=clang++ CUDAHOSTCXX=g++
                          CMAKE_ARGS=-DCUJU_CUDA=ON
                          CMAKE_CUDA_ARCHITECTURES="75-real;80-real;86-real;89-real"
                    - name: linux-aarch64
                      runner: ubuntu-24.04-arm
                      cibuildwheel: cp312-manylinux_aarch64
                      before_all: dnf install -y clang
                      environment: CXX=clang++ CMAKE_ARGS=-DCUJU_CUDA=OFF
                      cpu_only: true
                    # CUDA 12.9 takes Visual Studio 2017 to 2022, which windows-2025 no longer has.
                    - name: windows-x86-64
                      runner: windows-2022
                      cmake_args: -DCUJU_CUDA=ON
                      cuda_architectures: 75-real;80-real;86-real;89-real
                      cuda: true
                    - name: macos-arm64
                      runner: macos-15
                      cmake_args: -DCUJU_CUDA=OFF
                      deployment_target: '11.0'
                      cpu_only: true
                    # macos-13 is retired, and macos-15-intel is the x86-64 image left.
                    - name: macos-x86-64
                      runner: macos-15-intel
                      cmake_args: -DCUJU_CUDA=OFF
                      deployment_target: '10.15'
                      cpu_only: true
        defaults:
            run:
                shell: bash
        env:
            PIP_DISABLE_PIP_VERSION_CHECK: '1'
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
            - name: Date every file of the build by the commit
              run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
            - name: Install the CUDA toolkit
              if: matrix.cuda
              uses: Jimver/cuda-toolkit@v0.2.36
              with:
                  cuda: '12.9.1'
                  method: network
                  sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
            - name: Use MSVC from the command line
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
                  $vs = & $vswhere -latest -products * -property installationPath `
                      -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
                  $before = @{}
                  Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
                  cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
                      if ($_ -match '^([^=]+)=(.*)$' -and $before[$matches[1]] -ne $matches[2]) {
                          "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV
                      }
                  }
            - name: Describe the runner
              run: |
                  python -c "import platform, sys; print(platform.platform(), platform.machine(), sys.version)"
                  cmake --version | head -n 1
                  if [ "$RUNNER_OS" = Windows ]; then cl 2>&1 | head -n 1; nvcc --version | tail -n 2;
                  elif [ "$RUNNER_OS" = macOS ]; then clang++ --version | head -n 1; sysctl -n machdep.cpu.brand_string;
                  fi
            - name: Build the wheel twice in the manylinux image
              if: runner.os == 'Linux'
              env:
                  CIBW_BUILD: ${{ matrix.cibuildwheel }}
                  CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
                  CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
                  CIBW_BEFORE_ALL: ${{ matrix.before_all }}
                  CIBW_ENVIRONMENT: ${{ matrix.environment }}
                  CIBW_ENVIRONMENT_PASS_LINUX: SOURCE_DATE_EPOCH
                  CIBW_CONFIG_SETTINGS: build.verbose=true
                  CIBW_BUILD_VERBOSITY: '1'
              run: |
                  python -m pip install cibuildwheel==4.3.4
                  python -m cibuildwheel --output-dir wheelhouse 2>&1 | tee build.log
                  python -m cibuildwheel --output-dir wheelhouse-again 2>&1 | tee build-again.log
            - name: Build the wheel twice on the runner
              if: runner.os != 'Linux'
              env:
                  CMAKE_ARGS: ${{ matrix.cmake_args }}
                  CMAKE_CUDA_ARCHITECTURES: ${{ matrix.cuda_architectures }}
                  MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
              run: |
                  if [ -z "$CMAKE_CUDA_ARCHITECTURES" ]; then unset CMAKE_CUDA_ARCHITECTURES; fi
                  if [ -z "$MACOSX_DEPLOYMENT_TARGET" ]; then unset MACOSX_DEPLOYMENT_TARGET; fi
                  if [ "$RUNNER_OS" = Windows ]; then export CMAKE_GENERATOR=Ninja; fi
                  python -m pip install --upgrade pip ninja
                  python -m pip wheel . --no-deps -v -w wheelhouse -C build.verbose=true 2>&1 | tee build.log
                  rm -rf build
                  python -m pip wheel . --no-deps -v -w wheelhouse-again -C build.verbose=true 2>&1 \
                      | tee build-again.log
            - name: Compare the two builds
              run: python ci/checks/compare_builds.py wheelhouse wheelhouse-again
            - name: Check the compile flags
              run: |
                  grep -ohE "fp:precise|ffp-contract=off" build.log | sort | uniq -c
                  if grep -E "fp:fast|fp:contract|ffast-math|ffp-contract=(fast|on)" build.log; then
                      echo "a contracting or fast-math flag reached the build"; exit 1
                  fi
            - name: Check the licenses and the libraries of the wheel
              run: |
                  python ci/checks/check_wheel.py ${{ matrix.cpu_only && '--cpu-only' || '' }} wheelhouse/*.whl
                  ls -l wheelhouse
                  python -c "import sys, zipfile; [print(n) for n in zipfile.ZipFile(sys.argv[1]).namelist() if not n.startswith('cuju/gfootball')]" wheelhouse/*.whl
            - uses: actions/upload-artifact@v7
              with:
                  name: wheel-${{ matrix.name }}
                  path: wheelhouse/*.whl
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: build-log-${{ matrix.name }}
                  path: build*.log

    test:
        name: test ${{ matrix.name }}
        needs: wheel
        if: ${{ !cancelled() }}
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: linux-x86-64
                      runner: ubuntu-24.04
                      torch: torch --index-url https://download.pytorch.org/whl/cpu
                    - name: linux-aarch64
                      runner: ubuntu-24.04-arm
                      torch: torch --index-url https://download.pytorch.org/whl/cpu
                    - name: windows-x86-64
                      runner: windows-2025
                      torch: torch --index-url https://download.pytorch.org/whl/cpu
                    - name: macos-arm64
                      runner: macos-15
                      torch: torch
                    # PyTorch's last x86-64 macOS wheel is 2.2.2, built against numpy 1.
                    - name: macos-x86-64
                      runner: macos-15-intel
                      torch: torch==2.2.2 'numpy<2'
        defaults:
            run:
                shell: bash
        env:
            PIP_DISABLE_PIP_VERSION_CHECK: '1'
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
            - uses: actions/download-artifact@v8
              with:
                  name: wheel-${{ matrix.name }}
                  path: wheelhouse
            - name: Make a new environment
              run: |
                  python -m venv "$RUNNER_TEMP/venv"
                  if [ "$RUNNER_OS" = Windows ]; then
                      echo "VENV_PYTHON=$RUNNER_TEMP/venv/Scripts/python.exe" >> "$GITHUB_ENV"
                  else
                      echo "VENV_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
                  fi
            - name: Install PyTorch for the CPU
              run: '"$VENV_PYTHON" -m pip install ${{ matrix.torch }}'
            - name: Install the wheel
              run: |
                  wheel=$(ls wheelhouse/cuju_engine-*.whl)
                  echo "WHEEL=$wheel" >> "$GITHUB_ENV"
                  "$VENV_PYTHON" -m pip install "$wheel"
                  "$VENV_PYTHON" -m pip list
            - name: cuju.check on the CPU
              working-directory: ${{ runner.temp }}
              run: '"$VENV_PYTHON" -I -m cuju.check --device cpu 2>&1 | tee check.log'
            - name: The public tests
              working-directory: ${{ runner.temp }}
              run: |
                  "$VENV_PYTHON" -m pip install "$GITHUB_WORKSPACE/$WHEEL[test,spaces]"
                  "$VENV_PYTHON" -m pytest -ra -p no:cacheprovider "$GITHUB_WORKSPACE/tests"
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: check-${{ matrix.name }}
                  path: ${{ runner.temp }}/check.log
                  if-no-files-found: ignore

    # syft reads metadata, and the code that the libraries compile in or link statically has none.
    sbom:
        needs: [sdist, wheel, gfootball]
        uses: cuju-football/.github/.github/workflows/sbom.yml@main
        with:
            artifacts: '{sdist,wheel-*,cuju-gfootball}'

    grf-media:
        runs-on: ubuntu-24.04
        env:
            PIP_DISABLE_PIP_VERSION_CHECK: '1'
        steps:
            - uses: actions/checkout@v7
            - uses: actions/checkout@v7
              with:
                  repository: google-research/football
                  ref: 3d9e754720a95621bba6475c4d3b0d56fe919014
                  path: grf
                  persist-credentials: false
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
            - name: Date every file of the build by the commit
              run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
            # The converter refuses an atlas from other library versions than Ubuntu 24.04 has.
            - name: Render the glyph atlas with SDL_ttf
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libsdl2-2.0-0 libsdl2-ttf-2.0-0 libfreetype6 libharfbuzz0b
                  python ci/make/make_glyph_atlas.py grf/third_party/fonts/AlegreyaSansSC-ExtraBold.ttf generated
            - name: Copy GRF's media into the package
              run: python ci/make/make_render_media.py grf --generated generated
            - name: Build the wheel twice and compare the bytes
              run: |
                  pip install build
                  python -m build --wheel --outdir grf-media packaging/cuju-grf-media
                  python -m build --wheel --outdir "$RUNNER_TEMP/grf-media-again" packaging/cuju-grf-media
                  python ci/checks/compare_builds.py grf-media "$RUNNER_TEMP/grf-media-again"
            - name: Check the files and the licenses of the wheel
              run: |
                  python ci/checks/check_wheel.py --grf-media grf-media/*.whl
                  ls -l grf-media
            - name: Install the wheel and check the installed media
              run: |
                  python -m venv "$RUNNER_TEMP/venv"
                  "$RUNNER_TEMP/venv/bin/python" -m pip install grf-media/*.whl
                  cd "$RUNNER_TEMP"
                  export PYTHONPATH="$GITHUB_WORKSPACE/python"
                  "$RUNNER_TEMP/venv/bin/python" -c \
                      "from cuju import _media; p = _media.problems(); print(_media.root()); assert not p, p"
            - uses: actions/upload-artifact@v7
              with:
                  name: grf-media
                  path: grf-media/*.whl

    publish:
        needs: [sdist, wheel, gfootball, test, sbom]
        if: >-
            github.event_name == 'workflow_dispatch' && inputs.publish
            && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-24.04
        # The environment requires a maintainer's approval before anything is published.
        environment: pypi
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - name: Check that the tag names the version of the package
              run: |
                  version=$(python3 -c "import runpy; print(runpy.run_path('python/cuju/_version.py')['__version__'])")
                  if [ "$GITHUB_REF_NAME" != "v$version" ]; then
                      echo "the tag $GITHUB_REF_NAME names another version than __version__ $version"
                      exit 1
                  fi
            - uses: actions/download-artifact@v8
              with:
                  path: dist
                  pattern: '{sdist,wheel-*}'
                  merge-multiple: true
            - uses: pypa/gh-action-pypi-publish@release/v1

    # Uploads only when PyPI lacks the version, and any answer but found or missing stops the job.
    publish-gfootball:
        needs: [gfootball, publish]
        if: >-
            github.event_name == 'workflow_dispatch' && inputs.publish
            && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-24.04
        environment: pypi-gfootball
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Check that the tag names the version of the package
              run: |
                  version=$(python3 -c "import runpy; print(runpy.run_path('python/cuju/_version.py')['__version__'])")
                  if [ "$GITHUB_REF_NAME" != "v$version" ]; then
                      echo "the tag $GITHUB_REF_NAME names another version than __version__ $version"
                      exit 1
                  fi
            - uses: actions/download-artifact@v8
              with:
                  name: cuju-gfootball
                  path: dist
            - name: Upload cuju-gfootball only where PyPI lacks its version
              id: pypi
              run: |
                  version=$(python3 -c "import runpy; print(runpy.run_path('packages/cuju-gfootball/src/cuju/gfootball_alias/_version.py')['__version__'])")
                  status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/cuju-gfootball/$version/json")
                  case "$status" in
                      200) echo "cuju-gfootball $version is on PyPI, so nothing uploads"; echo "upload=false" >> "$GITHUB_OUTPUT" ;;
                      404) echo "cuju-gfootball $version is new and uploads"; echo "upload=true" >> "$GITHUB_OUTPUT" ;;
                      *) echo "PyPI answered $status for cuju-gfootball $version"; exit 1 ;;
                  esac
                  ls -l dist
            - uses: pypa/gh-action-pypi-publish@release/v1
              if: steps.pypi.outputs.upload == 'true'

    # Uploads only when PyPI lacks the version, and any answer but found or missing stops the job.
    publish-grf-media:
        needs: [grf-media]
        if: >-
            github.event_name == 'workflow_dispatch' && inputs.publish
            && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-24.04
        environment: pypi-grf-media
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Check that the tag names the version of the package
              run: |
                  version=$(python3 -c "import runpy; print(runpy.run_path('python/cuju/_version.py')['__version__'])")
                  if [ "$GITHUB_REF_NAME" != "v$version" ]; then
                      echo "the tag $GITHUB_REF_NAME names another version than __version__ $version"
                      exit 1
                  fi
            - uses: actions/download-artifact@v8
              with:
                  name: grf-media
                  path: dist
            - name: Upload cuju-grf-media only where PyPI lacks its version
              id: pypi
              run: |
                  version=$(python3 -c "import runpy; print(runpy.run_path('packaging/cuju-grf-media/src/cuju/grf_media/__init__.py')['__version__'])")
                  status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/cuju-grf-media/$version/json")
                  case "$status" in
                      200) echo "cuju-grf-media $version is on PyPI, so nothing uploads"; echo "upload=false" >> "$GITHUB_OUTPUT" ;;
                      404) echo "cuju-grf-media $version is new and uploads"; echo "upload=true" >> "$GITHUB_OUTPUT" ;;
                      *) echo "PyPI answered $status for cuju-grf-media $version"; exit 1 ;;
                  esac
                  ls -l dist
            - uses: pypa/gh-action-pypi-publish@release/v1
              if: steps.pypi.outputs.upload == 'true'
