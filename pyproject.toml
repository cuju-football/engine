[build-system]
requires = ["scikit-build-core>=0.12"]
build-backend = "scikit_build_core.build"

[project]
name = "cuju-engine"
# The version is `__version__` in `python/cuju/_version.py`.
dynamic = ["version"]
description = "A bit-exact, batched reimplementation of Google Research Football, for CUDA and CPU"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND LGPL-2.1-or-later AND MIT AND SunPro AND BSL-1.0 AND BSD-3-Clause AND Zlib"
# The licenses of the engine. Of the others in LICENSES/, Unlicense and OFL-1.1 cover GRF's media,
# which the wheel of cuju-grf-media holds.
license-files = [
    "LICENSE",
    "NOTICE",
    "LICENSES/LGPL-2.1-or-later.txt",
    "LICENSES/MIT.txt",
    "LICENSES/MIT-gym.txt",
    "LICENSES/MIT-Mesa.txt",
    "LICENSES/Zlib.txt",
    "LICENSES/SunPro.txt",
    "LICENSES/BSL-1.0.txt",
    "LICENSES/BSD-3-Clause.txt",
]
authors = [{ name = "André Koraleski" }]
keywords = [
    "gfootball",
    "google-research-football",
    "football",
    "reinforcement-learning",
    "multi-agent",
    "cuda",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Simulation",
]
# PyTorch's last x86-64 macOS wheel is 2.2.2, built against numpy 1. PyTorch reads the GPU
# outputs, which it takes through `__cuda_array_interface__`, with numpy.
dependencies = [
    "torch>=2.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch>=2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # GRF's Python package, which `cuju.gfootball` ports, imports both at the top of its modules.
    "absl-py",
    "six",
    # The machine config, a TOML file. Python 3.11 has the reader in its library.
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
cuju = "cuju.__main__:main"
# A name that cuju 0.2.1 lacks, so it survives an upgrade that deletes the engine, which see
# `cuju.engine_status`.
cuju-repair = "cuju.engine_status:main"

# Gymnasium before 1.0 loads this group at import. Later versions load nothing, so `import cuju.env`
# registers the ids there.
[project.entry-points."gymnasium.envs"]
__root__ = "cuju.env:register_environments"

[project.urls]
Homepage = "https://github.com/cuju-football/engine"
Documentation = "https://github.com/cuju-football/engine/tree/main/docs"
Issues = "https://github.com/cuju-football/engine/issues"
Changelog = "https://github.com/cuju-football/engine/blob/main/CHANGELOG.md"

[project.optional-dependencies]
spaces = ["gymnasium>=0.29"]
# The PettingZoo adapter of cuju.agents.
pettingzoo = ["pettingzoo>=1.24", "gymnasium>=0.29"]
test = ["pytest>=8", "psutil"]
# GRF's media, which cuju's software renderer draws, the package cuju-grf-media.
pixels = ["cuju-grf-media>=0.4.0,<0.5"]
# What GRF's Python package needs for frames and videos, for its game and keyboard players, and
# for its remote environments. Its frames take GRF's media.
gfootball-video = ["opencv-python", "cuju-grf-media>=0.4.0,<0.5"]
gfootball-play = ["pygame"]
gfootball-remote = ["grpcio", "protobuf"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
cmake.build-type = "Release"
wheel.packages = ["python/cuju"]
# The libraries load through ctypes and link neither Python nor torch, so one wheel serves every
# Python 3.
wheel.py-api = "py3"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "python/cuju/_version.py"

[tool.scikit-build.cmake.define]
CMAKE_CUDA_ARCHITECTURES = { env = "CMAKE_CUDA_ARCHITECTURES", default = "native" }

[tool.ruff]
line-length = 100
# `cuju` and the shared fixtures of `tests` import as first-party code.
src = ["python", "tests"]
indent-width = 4
target-version = "py310"
# GRF's Python package and gym's core, which stay as `ci/make/port_gfootball.py` writes them.
# `_cv2.py` and `_gym/__init__.py` are cuju's own, so they stay checked.
extend-exclude = [
    "python/cuju/gfootball/__init__.py",
    "python/cuju/gfootball/play_game.py",
    "python/cuju/gfootball/replay.py",
    "python/cuju/gfootball/dump_to_txt.py",
    "python/cuju/gfootball/dump_to_video.py",
    "python/cuju/gfootball/env",
    "python/cuju/gfootball/scenarios",
    "python/cuju/gfootball/eval_server",
    "python/cuju/gfootball/examples",
    "python/cuju/gfootball/_gym/_vendored",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
# client.py runs under Python 3.8, so it keeps the spellings of that version.
"python/cuju/agents/client.py" = ["UP006", "UP007", "UP031", "UP035", "UP045", "UP024", "B904", "RUF012"]
# GRF's scenario API keeps GRF's method names.
"python/cuju/scenarios.py" = ["N802", "N815"]
"python/cuju/_grf_config.py" = ["N802"]
# GRF's module names its enumerations and boost.python's base as GRF does, and its classes build
# their properties from helpers in their bodies.
"python/cuju/gfootball_engine/_gameplayfootball.py" = ["N801", "N805", "N816"]

[tool.pytest.ini_options]
testpaths = ["tests"]
